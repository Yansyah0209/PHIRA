name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, build installable APK, and check lint
        run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --stacktrace
      - name: Prepare phone download
        run: |
          mkdir -p phone-download
          cp app/build/outputs/apk/debug/app-debug.apk phone-download/PHIRA-early-access.apk
          cp docs/install-android.md phone-download/INSTALL.md
          cd phone-download
          sha256sum PHIRA-early-access.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PHIRA-debug-apk
          path: phone-download/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
